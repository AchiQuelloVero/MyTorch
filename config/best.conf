{
    "input_size": 776,
    "layers": [
        {
            "size": 256,
            "activation": "relu"
        },
        {
            "size": 64,
            "activation": "relu"
        },
        {
            "size": 3,
            "activation": "softmax"
        }
    ],
    "classes": [
        "Nothing",
        "Check",
        "Checkmate"
    ],
    "init": "he",
    "loss": "cross_entropy",
    "optimizer": "adam",
    "learning_rate": 0.001,
    "lr_decay": 0.0,
    "batch_size": 64,
    "epochs": 60,
    "validation_split": 0.1,
    "dropout": 0.0,
    "l2": 0.0001,
    "early_stopping": 5,
    "seed": 42
}
